name: Fix leech middle-deck semantics

on:
  push:
    branches:
      - fix/leech-middle-deck-lapses

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[srs-fix-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/leech-middle-deck-lapses
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write regression tests first
        run: |
          mkdir -p tests
          cat > tests/srs-lapse.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          import { readFileSync } from 'node:fs';

          function loadApplyHardLapse() {
            const source = readFileSync(new URL('../js/app/main.js', import.meta.url), 'utf8');
            const start = source.indexOf('function preLapseIntervalDays(progress)');
            const end = source.indexOf('// Uncertain lapse:', start);
            assert.ok(start >= 0 && end > start, 'expected hard-lapse source block');
            const snippet = source.slice(start, end);
            const context = {
              clamp: (value, min, max) => Math.min(max, Math.max(min, value)),
              getLastEasyIntervalDays: progress => Math.max(0, Number(progress.lastEasyIntervalDays) || 0),
              getSrsStage: progress => Math.max(0, Math.floor(Number(progress.srsStage) || 0)),
              getSrsEase: progress => {
                const ease = Math.min(3, Math.max(1.3, Number(progress.ease) || 2.3));
                progress.ease = ease;
                return ease;
              },
              setProgressDelay: (progress, delayMs, now) => {
                progress.intervalDays = delayMs > 0 ? delayMs / (22 * 60 * 60 * 1000) : 0;
                progress.dueAt = now + delayMs;
              },
              msFromDays: days => days <= 1
                ? days * 22 * 60 * 60 * 1000
                : (22 + (days - 1) * 24) * 60 * 60 * 1000,
              SRS_HARD_RELEARN_STEPS: 2,
              LEECH_LAPSE_THRESHOLD: 4,
              LEECH_DRILL_DAYS: 1
            };
            vm.createContext(context);
            vm.runInContext(`${snippet}\nthis.__applyHardLapse = applyHardLapse;`, context);
            return context.__applyHardLapse;
          }

          const relaxed = { leechEnabled: true, lapseResumeCapDays: 14 };
          const almostEqual = (actual, expected) => assert.ok(Math.abs(actual - expected) < 1e-9, `${actual} ~= ${expected}`);

          test('fresh-card Again retries never become lapses or leeches', () => {
            const applyHardLapse = loadApplyHardLapse();
            const progress = {
              streak: 0, easyStreak: 0, srsStage: 0, ease: 2.3,
              intervalDays: 0, lastEasyIntervalDays: 0,
              inRelearn: false, relearnLeft: 0, preLapseIntervalDays: 0,
              lapseCount: 0, leechDrill: false, leechStreak: 0
            };
            for (let n = 0; n < 6; n++) {
              const now = 1_800_000_000_000 + n * 1000;
              assert.equal(applyHardLapse(progress, relaxed, now), true);
              assert.equal(progress.dueAt, now);
            }
            assert.equal(progress.lapseCount, 0);
            assert.equal(progress.leechDrill, false);
            almostEqual(progress.ease, 2.3);
          });

          test('repeated Again in one established-card relearn episode counts one lapse', () => {
            const applyHardLapse = loadApplyHardLapse();
            const progress = {
              streak: 5, easyStreak: 5, srsStage: 4, ease: 2.3,
              intervalDays: 14, lastEasyIntervalDays: 14,
              inRelearn: false, relearnLeft: 0, preLapseIntervalDays: 0,
              lapseCount: 0, leechDrill: false, leechStreak: 0
            };
            applyHardLapse(progress, relaxed, 1_800_000_000_000);
            assert.equal(progress.lapseCount, 1);
            almostEqual(progress.ease, 2.1);
            assert.equal(progress.srsStage, 3);
            for (let n = 1; n <= 4; n++) {
              const now = 1_800_000_000_000 + n * 1000;
              assert.equal(applyHardLapse(progress, relaxed, now), true);
              assert.equal(progress.dueAt, now);
            }
            assert.equal(progress.lapseCount, 1);
            assert.equal(progress.leechDrill, false);
            almostEqual(progress.ease, 2.1);
            assert.equal(progress.srsStage, 3);
          });

          test('fourth genuine lapse marks a leech but Hard still retries in-session', () => {
            const applyHardLapse = loadApplyHardLapse();
            const now = 1_800_000_000_000;
            const progress = {
              streak: 5, easyStreak: 5, srsStage: 4, ease: 2.3,
              intervalDays: 14, lastEasyIntervalDays: 14,
              inRelearn: false, relearnLeft: 0, preLapseIntervalDays: 14,
              lapseCount: 3, leechDrill: false, leechStreak: 2
            };
            assert.equal(applyHardLapse(progress, relaxed, now), true);
            assert.equal(progress.lapseCount, 4);
            assert.equal(progress.leechDrill, true);
            assert.equal(progress.leechStreak, 0);
            assert.equal(progress.dueAt, now);
            assert.equal(applyHardLapse(progress, relaxed, now + 1000), true);
            assert.equal(progress.lapseCount, 4);
            assert.equal(progress.dueAt, now + 1000);
          });
          EOF

      - name: Confirm regression tests fail before the fix
        run: |
          set +e
          node --test tests/srs-lapse.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression tests to fail before production changes.' >&2
            exit 1
          fi

      - name: Apply canonical lapse/leech fix and cache bump
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/app/main.js')
          text = path.read_text()
          start = text.index('function applyHardLapse(progress, cadence, now) {')
          end_marker = '\n}\n\n// Uncertain lapse:'
          end = text.index(end_marker, start) + 2
          replacement = '''function applyHardLapse(progress, cadence, now) {
            const wasInRelearn = progress.inRelearn === true;
            const wasLeech = progress.leechDrill === true;
            const establishedDays = preLapseIntervalDays(progress);
            // A lapse is a NEW failure episode of previously established spacing.
            // Fresh-card retries and repeated Hard marks during the same relearn
            // episode stay in the middle deck without repeatedly penalising ease,
            // stage, or the lifetime lapse counter.
            const startsLapseEpisode = !wasInRelearn && !wasLeech && establishedDays > 0;

            progress.streak = 0;
            progress.easyStreak = 0;
            if (startsLapseEpisode) {
              progress.srsStage = Math.max(0, getSrsStage(progress) - 1);
              progress.ease = clamp(getSrsEase(progress) - 0.2, 1.3, 3.0);
              progress.lapseCount = (progress.lapseCount || 0) + 1;
              progress.preLapseIntervalDays = establishedDays;
            }

            // Leech is a property of repeated genuine lapses of an established
            // card. Even a leech still relearns IN SESSION: a failed daily drill
            // goes through middle/due-now until cleared; the 1-day leech cadence
            // is scheduled only after a clean answer in applyCorrectOutcome().
            const shouldLeech = cadence.leechEnabled && (
              wasLeech || (startsLapseEpisode && progress.lapseCount >= LEECH_LAPSE_THRESHOLD)
            );
            if (shouldLeech) {
              progress.leechDrill = true;
              progress.leechStreak = 0;
              progress.inRelearn = false;
              progress.relearnLeft = 0;
              setProgressDelay(progress, 0, now);
              return true;
            }

            // Capture the pre-lapse spacing only when entering the episode. A
            // repeated in-session Hard keeps the original spacing and merely
            // restarts the short relearn ladder.
            if (!wasInRelearn) progress.preLapseIntervalDays = establishedDays;
            progress.inRelearn = true;
            progress.relearnLeft = SRS_HARD_RELEARN_STEPS;
            setProgressDelay(progress, 0, now); // due now — route through middle
            return true;
          }'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          p = Path('sw.js')
          src = p.read_text()
          if 'v343' not in src or '?v=343' not in src:
            raise SystemExit('expected v343 cache name and ?v=343 assets in sw.js')
          p.write_text(src.replace('v343', 'v344').replace('?v=343', '?v=344'))

          p = Path('index.html')
          src = p.read_text()
          if '?v=343' not in src:
            raise SystemExit('expected ?v=343 asset tokens in index.html')
          p.write_text(src.replace('?v=343', '?v=344'))
          PY

      - name: Run green verification
        run: |
          node --test tests/srs-lapse.test.mjs
          node --check js/app/main.js
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Commit and push verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app/main.js tests/srs-lapse.test.mjs sw.js index.html
          git commit -m '[srs-fix-generated] Fix leech lapse episodes and middle retries'
          git push origin HEAD:fix/leech-middle-deck-lapses
